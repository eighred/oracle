[package]
name = "oracle-report-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
oracle-backtest = { path = "../backtest" }
oracle-market-data = { path = "../market_data" }
oracle-spot-amount = { path = "../spot_amount" }
oracle-portfolio-replay = { path = "../portfolio_replay" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "net", "sync"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
