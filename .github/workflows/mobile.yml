name: Oracle mobile
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts && npm run build && npx --no-install cap sync android
      - name: Assemble pilot APK and unsigned release bundle
        run: JAVA_HOME="$JAVA_HOME_21_X64" bash android/gradlew -p android --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oracle-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oracle-android-bundle
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts && npm run build && npx --no-install cap sync ios
      - name: Archive the unsigned iPhone device build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Oracle.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent "$RUNNER_TEMP/Oracle.xcarchive" "$RUNNER_TEMP/oracle-ios-device.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oracle-ios-device
          path: ${{ runner.temp }}/oracle-ios-device.zip
          retention-days: 3
      - name: Build and launch the iPhone simulator app
        run: |
          phone=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$phone" || xcrun simctl bootstatus "$phone" -b
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$phone" -derivedDataPath "$RUNNER_TEMP/oracle" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/oracle/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl bootstatus "$phone" -b
          xcrun simctl install "$phone" "$app"
          xcrun simctl launch "$phone" com.eighred.oracle
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/oracle-ios-simulator.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oracle-ios-simulator
          path: ${{ runner.temp }}/oracle-ios-simulator.zip
          retention-days: 3
