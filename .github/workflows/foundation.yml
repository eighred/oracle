name: Oracle foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    uses: ./.github/workflows/oracle-forge.yml
  foundation:
    needs: forge
    if: always()
    name: oracle-ci-required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Forge checks
        env:
          FORGE_RESULT: ${{ needs.forge.result }}
        run: test "$FORGE_RESULT" = success
      - run: python3 -B tools/check_foundation.py verify
      - run: python3 -B -m unittest discover -s tests -v
      - name: Verify the financial core and offline market adapter
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python3 crates/portfolio_replay/tests/risk_reference.py
          python3 crates/backtest/tests/accounting_reference.py
          cargo build --locked -p oracle-report-api
      - name: Verify the Vue workstation, scoped PostgreSQL reads and restore
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          npx --no-install playwright install --with-deps chromium
          pg_bin=$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1)")
          test -x "$pg_bin/initdb"
          python3 ../core/crates/report_api/tools/local_pilot.py \
            --pg-bin "$pg_bin" --api-bin ../core/target/debug/oracle-report-api \
            --dist dist --port 0 --check npm run test:browser
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_gitleaks
      - run: gitleaks git . --redact --no-banner --log-opts="--all --full-history"
      - run: gitleaks dir . --redact --no-banner
  detector:
    name: secret-scan-selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gitleaks
      - run: python3 -B tools/check_secret_scan.py
